name: AI Tools Checks

# tools/analysis/ 或 CI 工作流变更时触发（push）。
# pull_request 不做路径过滤：仓库 ruleset 将 "Ruff lint & pytest" 设为 required status check，
# 路径过滤会让不触达 tools/analysis 的 PR 缺失该检查而无法合并（required check 必须出现且通过）。
on:
  push:
    paths:
      - 'tools/analysis/**'
      - '.github/workflows/**'
  pull_request:

jobs:
  lint-and-test:
    name: Ruff lint & pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check tools/analysis

      - name: Test (pytest)
        run: pytest tools/analysis
