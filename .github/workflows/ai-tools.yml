name: AI Tools Checks

# tools/analysis/ 或 CI 工作流变更时触发。
# 注意：.github/workflows/** 必须包含——仓库 ruleset 将 "Ruff lint & pytest" 设为 required status check，
# dependabot 等只改 workflow 的 PR 若不触发本工作流会导致该检查缺失而无法合并。
on:
  push:
    paths:
      - 'tools/analysis/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tools/analysis/**'
      - '.github/workflows/**'

jobs:
  lint-and-test:
    name: Ruff lint & pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check tools/analysis

      - name: Test (pytest)
        run: pytest tools/analysis
