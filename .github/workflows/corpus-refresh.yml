name: Corpus Refresh

on:
  schedule:
    - cron: '0 4 1 * *' # 每月 1 日 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Ranked corpus refresh
    runs-on: ubuntu-latest
    env:
      # 凭据仅从环境变量/ Secrets 读取，绝不硬编码；无凭据时走合成回退
      OSU_API_CLIENT_ID: ${{ secrets.OSU_API_CLIENT_ID }}
      OSU_API_CLIENT_SECRET: ${{ secrets.OSU_API_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (if any)
        shell: bash
        run: |
          set -e
          if [ -f tools/analysis/requirements.txt ]; then
            pip install -r tools/analysis/requirements.txt
          fi
          pip install ruff pytest 2>/dev/null || true

      - name: Corpus generation (credential-safe)
        shell: bash
        run: |
          set -e
          echo "== Ranked corpus refresh =="

          # 凭据仅从 env 读取，不回显、不写文件
          if [ -n "${OSU_API_CLIENT_ID:-}" ] && [ -n "${OSU_API_CLIENT_SECRET:-}" ]; then
            echo "Credentials present (OSU_API_CLIENT_ID set) — attempting real corpus generation if supported."
          else
            echo "No credentials in env (OSU_API_CLIENT_ID/OSU_API_CLIENT_SECRET unset) — using synthetic fallback (no network)."
          fi

          # 优先尝试真实入口；不存在时走合成回退；均不要求凭据写死
          if [ -f tools/analysis/corpus.py ]; then
            echo "Running corpus.py..."
            # corpus.py 自带 synthetic fallback，无凭据亦可产出 distributions.json
            python -m tools.analysis.corpus --help 2>&1 | head -n 20 || true
            # 实际生成：优先 module 方式，失败回退直接执行
            if python -m tools.analysis.corpus 2>&1; then
              echo "corpus generation via 'python -m tools.analysis.corpus' succeeded."
            elif python tools/analysis/corpus.py 2>&1; then
              echo "corpus generation via 'python tools/analysis/corpus.py' succeeded."
            else
              echo "::warning::corpus generation failed — keeping existing distributions.json"
            fi
          else
            echo "::notice::tools/analysis/corpus.py not found — skipping generation (placeholder no longer required)."
          fi

          echo "--- distributions.json (if updated) ---"
          cat tools/analysis/distributions.json 2>/dev/null | head -n 50 || echo "(no distributions.json yet)"
          # 兼容历史路径：部分版本输出到 src/osu.Game.Rulesets.AiStudio.Osu/distributions.json
          if [ -f src/osu.Game.Rulesets.AiStudio.Osu/distributions.json ]; then
            echo "--- src/osu.Game.Rulesets.AiStudio.Osu/distributions.json ---"
            cat src/osu.Game.Rulesets.AiStudio.Osu/distributions.json | head -n 50
          fi

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes detected — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create pull request (corpus refresh)
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(corpus): refresh ranked corpus distributions"
          title: "chore(corpus): refresh ranked corpus distributions"
          body: |
            由 `corpus-refresh.yml` 自动触发的 ranked 语料刷新。

            - 触发：每月 1 日 04:00 UTC 定时或手动 workflow_dispatch
            - 凭据：仅从 `OSU_API_CLIENT_ID` / `OSU_API_CLIENT_SECRET` Secrets 读取，无凭据时使用合成回退（`corpus.py` 内置 synthetic corpus）
            - 产出：`tools/analysis/distributions.json`（及兼容路径 `src/.../distributions.json`）
            - 需人工复核后合并（分布 P5–P95 是否合理）

            Auto-generated by corpus-refresh workflow.
          branch: chore/corpus-refresh
          delete-branch: true
          add-paths: |
            tools/analysis/distributions.json
            src/osu.Game.Rulesets.AiStudio.Osu/distributions.json

      - name: Upload corpus artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-distributions
          path: |
            tools/analysis/distributions.json
            src/osu.Game.Rulesets.AiStudio.Osu/distributions.json
          if-no-files-found: warn
